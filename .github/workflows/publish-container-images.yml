name: Publish container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize GHCR namespace
        id: registry
        shell: bash
        run: echo "namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-web:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-web:${{ github.ref_name }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-api:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish Agents Bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agents-bridge
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-agents-bridge:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-agents-bridge:${{ github.ref_name }}
          cache-from: type=gha,scope=agents-bridge
          cache-to: type=gha,mode=max,scope=agents-bridge

      - name: Publish New API image
        uses: docker/build-push-action@v6
        with:
          context: apps/new-api
          file: apps/new-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-new-api:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-new-api:${{ github.ref_name }}
          cache-from: type=gha,scope=new-api
          cache-to: type=gha,mode=max,scope=new-api

      - name: Publish New API database initializer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.new-api-patch
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-new-api-patch:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/tapcanvas-new-api-patch:${{ github.ref_name }}
          cache-from: type=gha,scope=new-api-patch
          cache-to: type=gha,mode=max,scope=new-api-patch

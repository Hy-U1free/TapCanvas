name: Publish container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            image: tapcanvas-web
            context: .
            file: deploy/Dockerfile.web
            cache_scope: web
          - name: API
            image: tapcanvas-api
            context: .
            file: deploy/Dockerfile.api
            cache_scope: api
          - name: Agents Bridge
            image: tapcanvas-agents-bridge
            context: .
            file: deploy/Dockerfile.agents-bridge
            cache_scope: agents-bridge
          - name: New API
            image: tapcanvas-new-api
            context: apps/new-api
            file: apps/new-api/Dockerfile
            cache_scope: new-api
          - name: New API database initializer
            image: tapcanvas-new-api-patch
            context: .
            file: deploy/Dockerfile.new-api-patch
            cache_scope: new-api-patch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize GHCR namespace
        id: registry
        shell: bash
        run: echo "namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/{1}:latest', steps.registry.outputs.namespace, matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
